<style>
  .site-main { padding: 0; }
  :root { --hdt-max: 1180px; }
  .hdt-inner { max-width: var(--hdt-max); margin: 0 auto; }
  .hdt-section { padding: 44px 40px; }
  .hdt-h2 { font-family: var(--serif); font-size: clamp(24px,4vw,34px); font-weight:900; color:var(--ink); letter-spacing:-.01em; margin-bottom:6px;}
  .hdt-sub { font-family: var(--body-serif); font-size:15px; color:var(--ink-mid); margin-bottom:22px;}
  .hdt-eyebrow { font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:.16em; text-transform:uppercase; color:var(--red); display:flex; align-items:center; gap:10px;}
  .hdt-eyebrow::before { content:""; width:28px; height:2px; background:var(--red); display:inline-block;}

  /* ── Hero (striped) ── */
  .hdt-stripe { background: var(--cream);
    padding: 56px 40px 40px; }
  .hdt-hero2 { display:grid; grid-template-columns: 1.05fr .95fr; gap:44px; align-items:center; max-width:var(--hdt-max); margin:0 auto;}
  .hdt-head { font-family:var(--serif); font-weight:900; color:var(--ink); font-size:clamp(38px,5.4vw,68px); line-height:1.02; letter-spacing:-.015em; margin:16px 0 20px;}
  .hdt-head .num { color:var(--red); font-style:italic;}
  .hdt-lede { font-family:var(--body-serif); font-size:17px; line-height:1.6; color:var(--ink-mid); max-width:38em;}
  .hdt-src { font-family:var(--sans); font-size:12px; color:var(--ink-light); margin-top:22px; display:flex; align-items:center; gap:8px;}
  .hdt-src::before{content:"";width:22px;height:1px;background:var(--ink-light);display:inline-block;}

  /* Donor box */
  .hdt-donorbox { background:#fff; border:1px solid rgba(26,18,8,.07); border-radius:6px; overflow:hidden;
    box-shadow:0 22px 48px -22px rgba(26,18,8,.30), 0 3px 8px rgba(26,18,8,.05);}
  .hdt-donorbox-top { background:var(--red); color:#fff; padding:26px 28px 22px;}
  .hdt-donorbox-top .lbl { font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.85);}
  .hdt-donorbox-top .big { font-family:var(--serif); font-weight:900; font-size:clamp(38px,5vw,56px); line-height:1; margin:6px 0 4px;}
  .hdt-donorbox-top .cap { font-family:var(--body-serif); font-size:13px; color:rgba(255,255,255,.8); margin-top:11px;}
  .hdt-donorbox-hd { font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink); background:var(--cream); padding:11px 28px; border-bottom:1px solid var(--cream-dark);}
  .hdt-dl-row { display:grid; grid-template-columns:26px 1fr auto; gap:12px; align-items:center; padding:11px 28px; border-bottom:1px solid var(--cream-mid);}
  .hdt-dl-row:last-child{border-bottom:0;}
  .hdt-dl-rank { font-family:var(--serif); font-weight:900; color:var(--ink-light); font-size:15px; font-style:italic;}
  .hdt-dl-name { font-family:var(--sans); font-weight:700; font-size:14px; color:var(--ink);}
  .hdt-dl-bar { height:4px; background:var(--red); margin-top:5px;}
  .hdt-dl-amt { font-family:var(--serif); font-weight:900; color:var(--red); font-size:16px; white-space:nowrap;}

  /* ── Monthly timeline ── */
  .hdt-tl-wrap { position:relative; margin-top:36px; }
  .hdt-tl-svg { width:100%; height:260px; display:block; }
  .hdt-tl-hint { margin:6px 0 0; text-align:center; font-family:var(--sans); font-size:12px; color:var(--ink-light); font-style:italic; }
  .hdt-tl-svg rect.bar { fill:var(--red); cursor:pointer; transition:fill .1s,opacity .1s;}
  .hdt-tl-svg rect.bar:hover { fill:var(--red-dark);}
  .hdt-tl-svg rect.bar.dim { fill:var(--ink-light); opacity:.28;}
  .hdt-tl-svg text { font-family:var(--sans); font-size:10px; fill:var(--ink-light);}
  .hdt-tl-svg line.axis { stroke:var(--cream-dark); }
  .hdt-tip { position:absolute; pointer-events:none; background:var(--ink); color:#fff; padding:12px 14px; min-width:210px; font-family:var(--sans); font-size:12px; line-height:1.5; box-shadow:4px 4px 0 rgba(0,0,0,.2); opacity:0; transform:translateY(4px); transition:opacity .12s; z-index:10;}
  .hdt-tip.on{opacity:1;transform:translateY(0);}
  .hdt-tip .tmon{font-weight:800;letter-spacing:.04em;text-transform:uppercase;font-size:11px;color:#e88;}
  .hdt-tip .ttot{font-family:var(--serif);font-weight:900;font-size:20px;margin:2px 0 8px;}
  .hdt-tip .trow{color:rgba(255,255,255,.85);}
  .hdt-tip .trow b{color:#fff;}

  /* ── Toggle + toolbar ── */
  .hdt-toolbar { display:flex; flex-wrap:wrap; gap:14px; align-items:center; justify-content:space-between; margin-bottom:22px;}
  .hdt-toggle { display:inline-flex; border:2px solid var(--ink);}
  .hdt-toggle button { font-family:var(--sans); font-size:13px; font-weight:800; letter-spacing:.04em; text-transform:uppercase; padding:9px 18px; background:#fff; color:var(--ink); border:0; cursor:pointer;}
  .hdt-toggle button.on { background:var(--ink); color:#fff;}
  .hdt-tools { display:flex; gap:12px; align-items:center; flex-wrap:wrap;}
  .hdt-count { font-family:var(--sans); font-size:12px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; color:var(--red);}
  .hdt-btn { font-family:var(--sans); font-size:12px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; padding:9px 14px; border:2px solid var(--ink); background:#fff; color:var(--ink); text-decoration:none; cursor:pointer; display:inline-flex; gap:7px; align-items:center;}
  .hdt-btn:hover{background:var(--cream);}
  .hdt-select { font-family:var(--sans); font-size:13px; padding:9px 12px; border:2px solid var(--ink); background:#fff; color:var(--ink);}
  .hdt-search { font-family:var(--sans); font-size:14px; padding:10px 14px; border:2px solid var(--ink); background:#fff; color:var(--ink); outline:none; width:100%; margin-bottom:18px;}
  .hdt-search:focus{border-color:var(--red);}

  /* ── Card grid ── */
  .hdt-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  .hdt-card { background:#fff; border:1px solid rgba(26,18,8,.07); border-radius:6px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column;
    box-shadow:0 10px 24px -14px rgba(26,18,8,.22), 0 2px 5px rgba(26,18,8,.05); transition:transform .1s, box-shadow .1s;}
  .hdt-card:hover { transform:translateY(-3px); box-shadow:0 18px 34px -16px rgba(26,18,8,.30), 0 3px 7px rgba(26,18,8,.06);}
  .hdt-card-top { display:flex; gap:14px; padding:16px; border-bottom:1px solid var(--cream-dark); align-items:center;}
  .hdt-avatar { position:relative; overflow:hidden; width:72px; height:72px; flex-shrink:0; background:var(--cream-dark); border-radius:4px; display:flex; align-items:center; justify-content:center; font-family:var(--serif); font-weight:900; font-style:italic; font-size:24px; color:var(--ink-mid);}
  .hdt-tags { display:flex; gap:6px; margin-bottom:5px; flex-wrap:wrap;}
  .hdt-tag { font-family:var(--sans); font-size:9.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:2px 7px;}
  .hdt-tag.chamber { background:var(--red); color:#fff;}
  .hdt-tag.party { border:1px solid var(--ink); color:var(--ink);}
  .hdt-tag.party.D { color:#1565C0; border-color:#1565C0;}
  .hdt-tag.party.R { color:var(--red); border-color:var(--red);}
  .hdt-tag.status.inc { background:#E8F5E9; color:#1b7a3d; border:1px solid #bcd8bc;}
  .hdt-tag.status.cand { background:#E8EEF7; color:#2b4a86; border:1px solid #c3d3ee;}
  .hdt-tag.status.fleg { background:#FBEEDC; color:#8a5a12; border:1px solid #e6cfa6;}
  .hdt-tag.status.fcand { background:#EEEEEE; color:#555; border:1px solid #d5d5d5;}
  /* Working Group explainer */
  .hdt-explainer { margin:0 0 26px; border:1px solid rgba(26,18,8,.14); border-left:4px solid var(--red); border-radius:8px; background:#fff; }
  .hdt-explainer > summary { list-style:none; cursor:pointer; padding:14px 20px; font-family:var(--sans); font-size:13px; font-weight:800; letter-spacing:.02em; text-transform:uppercase; color:var(--ink); display:flex; align-items:center; justify-content:space-between; }
  .hdt-explainer > summary::-webkit-details-marker { display:none; }
  .hdt-explainer > summary::after { content:'▾'; color:var(--red); font-size:14px; transition:transform .15s; }
  .hdt-explainer[open] > summary::after { transform:rotate(180deg); }
  .hdt-explainer-body { padding:2px 22px 18px; border-top:1px solid rgba(26,18,8,.08); }
  .hdt-explainer-body p { font-family:var(--serif,Georgia,serif); font-size:15px; line-height:1.6; color:var(--ink-mid); margin:14px 0 0; }
  .hdt-explainer-body a { color:var(--red); font-weight:700; }
  @media (max-width:640px){ .hdt-explainer-body p { font-size:14.5px; } }
  .hdt-avatar img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .hdt-card-name { font-family:var(--serif); font-size:18px; font-weight:900; line-height:1.1; color:var(--ink);}
  .hdt-card-place { font-family:var(--sans); font-size:12px; color:var(--ink-light); margin-top:3px; display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .hdt-tenure { font-weight:800; color:var(--red); white-space:nowrap; flex-shrink:0;}
  .hdt-sheet-tenure { color:var(--red); font-weight:800;}
  .hdt-profile { margin:0 0 4px; padding-left:18px; font-family:var(--body-serif); font-size:14px; line-height:1.55; color:var(--ink);}
  .hdt-profile li { margin-bottom:6px;}
  .hdt-profile-src { font-family:var(--body-serif); font-size:12.5px; line-height:1.5; color:var(--ink); opacity:.85; margin:2px 0 6px;}
  .hdt-profile-src span { font-weight:700; opacity:.9;}
  .hdt-profile-src a { color:var(--red); text-decoration:underline; word-break:break-word;}
  .hdt-profile-src .hdt-src-note { font-style:italic; opacity:.9;}
  .hdt-profile-ai { font-family:var(--body-serif); font-size:11.5px; font-style:italic; line-height:1.45; color:var(--ink); opacity:.6; margin:6px 0 2px; border-top:1px dotted rgba(0,0,0,.18); padding-top:6px;}
  .hdt-card-bot { padding:16px; margin-top:auto;}
  .hdt-card-amt { font-family:var(--serif); font-weight:900; font-size:30px; color:var(--red); line-height:1;}
  .hdt-card-cap { font-family:var(--sans); font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-light); margin:5px 0 9px;}
  .hdt-card-track { height:7px; background:var(--cream-mid);}
  .hdt-card-fill { height:100%; background:var(--red);}
  .hdt-empty { font-family:var(--body-serif); color:var(--ink-light); padding:40px 0; text-align:center;}

  /* ── Detail modal (screenshottable) ── */
  .hdt-modal { position:fixed; inset:0; background:rgba(26,18,8,.72); display:none; z-index:1000; overflow-y:auto; padding:24px 16px;}
  .hdt-modal.on { display:flex; align-items:flex-start; justify-content:center;}
  .hdt-sheet { background:var(--cream); width:100%; max-width:620px; border:1px solid rgba(26,18,8,.08); border-radius:8px; overflow:hidden; box-shadow:0 30px 70px -20px rgba(0,0,0,.5); margin:auto;}
  .hdt-sheet-bar { background:var(--red); color:#fff; display:flex; justify-content:space-between; align-items:center; padding:9px 16px; font-family:var(--sans); font-size:10.5px; font-weight:800; letter-spacing:.1em; text-transform:uppercase;}
  .hdt-sheet-bar button { background:none; border:0; color:#fff; font-size:20px; cursor:pointer; line-height:1;}
  .hdt-sheet-hd { display:flex; gap:18px; padding:22px; align-items:center;}
  .hdt-sheet-hd .hdt-avatar { width:76px; height:76px; font-size:26px;}
  /* Detail sheet: big portrait (left) with its bottom edge flush to the black total stripe */
  .hdt-sheet-top { display:flex; align-items:stretch; gap:0; }
  .hdt-sheet-photo { position:relative; overflow:hidden; width:210px; flex-shrink:0; min-height:240px; background:var(--cream-dark); display:flex; align-items:center; justify-content:center; }
  .hdt-sheet-photo img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
  .hdt-sheet-photo .ini { font-family:var(--serif); font-weight:900; font-style:italic; font-size:66px; color:var(--ink-mid); }
  .hdt-sheet-info { flex:1; min-width:0; padding:22px 24px; display:flex; flex-direction:column; justify-content:center; }
  .hdt-sheet-info .hdt-sheet-filter { padding:12px 0 0; margin-top:14px; background:none; border:0; border-top:1px solid rgba(26,18,8,.12); border-radius:0; }
  @media (max-width:560px){ .hdt-sheet-top{flex-direction:column;} .hdt-sheet-photo{width:100%;height:300px;min-height:0;} }
  .hdt-sheet-name { font-family:var(--serif); font-size:clamp(26px,5vw,36px); font-weight:900; line-height:1.05; color:var(--ink);}
  .hdt-sheet-place { font-family:var(--sans); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-light); margin-top:6px;}
  .hdt-nyha { font-family:var(--sans); font-size:10px; font-weight:800; letter-spacing:.06em; text-transform:uppercase; padding:3px 9px; display:inline-block; margin-top:8px;}
  .hdt-nyha.support{background:#E8F5E9;color:#1b7a3d;} .hdt-nyha.oppose{background:#FDE7E9;color:var(--red);} .hdt-nyha.unknown{background:var(--cream-dark);color:var(--ink-mid);}
  .hdt-sheet-total { background:var(--ink); color:#fff; padding:20px 22px;}
  .hdt-sheet-total .lbl{font-family:var(--sans);font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:#e88;}
  .hdt-sheet-total .big{font-family:var(--serif);font-weight:900;font-size:clamp(34px,7vw,52px);line-height:1;margin-top:4px;}
  .hdt-sheet-body { padding:22px;}
  .hdt-sheet-body h4 { font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-light); margin:20px 0 12px;}
  .hdt-sheet-body h4:first-child{margin-top:0;}
  .hdt-dd { display:grid; grid-template-columns:22px 1fr auto; gap:11px; align-items:center; padding:9px 0; border-bottom:1px solid var(--cream-dark);}
  .hdt-dd-rank{font-family:var(--serif);font-style:italic;font-weight:900;color:var(--ink-light);}
  .hdt-dd-name{font-family:var(--sans);font-weight:700;font-size:14px;color:var(--ink);}
  .hdt-dd-sec{font-family:var(--sans);font-size:11px;color:var(--ink-light);}
  .hdt-dd-bar{height:4px;background:var(--red);margin-top:5px;}
  .hdt-dd-amt{font-family:var(--serif);font-weight:900;color:var(--red);font-size:15px;white-space:nowrap;}
  /* Contributor card: tabs + click-to-filter scroll list */
  .hdt-tabs2{ display:flex; gap:22px; border-bottom:2px solid var(--cream-dark); margin:0 0 12px;}
  .hdt-tab2{ appearance:none; background:none; border:0; cursor:pointer; font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-light); padding:0 0 9px; border-bottom:2px solid transparent; margin-bottom:-2px;}
  .hdt-tab2.on{ color:var(--ink); border-bottom-color:var(--red);}
  .hdt-comp-filter{ display:flex; align-items:center; gap:8px; margin:0 0 12px;}
  .hdt-comp-filter select{ font-family:var(--sans); font-size:13px; padding:7px 10px; border:2px solid var(--ink); background:#fff; color:var(--ink); max-width:100%; flex:1;}
  .hdt-scrolllist{ max-height:300px; overflow-y:auto; scrollbar-width:none; -ms-overflow-style:none;}
  .hdt-scrolllist::-webkit-scrollbar{ display:none; width:0; height:0;}
  .hdt-clir{ cursor:pointer; padding-left:8px; padding-right:8px; margin:0 -8px; transition:background .1s;}
  .hdt-clir:hover{ background:var(--cream);}
  .hdt-clir.sel{ background:var(--cream); box-shadow:inset 3px 0 0 var(--red);}
  .hdt-selchip{ font-family:var(--sans); font-size:12px; color:var(--ink-mid); margin:0 0 10px;}
  .hdt-selchip b{ color:var(--ink);}
  .hdt-selchip button{ appearance:none; background:none; border:0; color:var(--red); font-family:var(--sans); font-size:12px; font-weight:700; cursor:pointer; text-decoration:underline; padding:0;}
  .hdt-selchip .hdt-jump{ display:inline-block; margin-top:6px; color:var(--red); font-family:var(--sans); font-size:12.5px; font-weight:800; letter-spacing:.02em; text-decoration:none; cursor:pointer;}
  .hdt-selchip .hdt-jump:hover{ text-decoration:underline;}
  .hdt-secbars .hdt-bar-row{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;margin-bottom:8px;}
  .hdt-bar-label{font-family:var(--sans);font-size:11px;font-weight:700;text-align:right;color:var(--ink);}
  .hdt-bar-track{height:16px;background:var(--cream-mid);} .hdt-bar-fill{height:100%;background:var(--red);}
  .hdt-bar-val{font-family:var(--sans);font-size:11px;color:var(--ink-mid);min-width:52px;text-align:right;}
  .hdt-mini-tl{width:100%;height:120px;} .hdt-mini-tl rect{fill:var(--red);}
  .hdt-mini-tl text.mtl-ax{font-family:var(--sans);font-size:8px;fill:var(--ink-light);}
  .hdt-mini-tl line.mtl-axl{stroke:var(--cream-dark);}
  .hdt-mtl-wrap{position:relative;}
  .hdt-mini-tl rect.mtl-bar{transition:fill .1s,opacity .1s;}
  .hdt-mini-tl rect.mtl-bar:hover{fill:var(--red-dark);cursor:pointer;}
  .hdt-mini-tl rect.mtl-bar.dim{fill:var(--ink-light);opacity:.28;}
  .hdt-secrow{cursor:pointer;margin-left:-8px;margin-right:-8px;padding-left:8px;padding-right:8px;border-radius:4px;transition:background .1s;}
  .hdt-secrow:hover{background:var(--cream);}
  .hdt-secrow.sel{background:var(--cream);box-shadow:inset 3px 0 0 var(--red);}
  .hdt-mtip{position:absolute;transform:translate(-50%,-100%);background:var(--ink);color:#fff;font-family:var(--sans);font-size:11px;padding:5px 8px;white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .1s;z-index:5;}
  .hdt-mtip.on{opacity:1;} .hdt-mtip .mt2{color:rgba(255,255,255,.8);margin-top:3px;font-size:10px;}
  /* main monthly timeline y-axis */
  .hdt-tl-svg line.ygrid{stroke:var(--cream-dark);stroke-dasharray:2 3;}
  .hdt-tl-svg text.ylab{font-family:var(--sans);font-size:10px;fill:var(--ink-light);}
  /* NYHA level + committees */
  .hdt-nyha-row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px;}
  .hdt-chips{display:flex;flex-wrap:wrap;gap:6px;}
  .hdt-chip{font-family:var(--sans);font-size:11px;padding:4px 9px;background:var(--cream);border:1px solid var(--cream-dark);color:var(--ink-mid);}
  .hdt-committees{margin:0 0 4px;}
  .hdt-committees summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:9px;font-family:var(--sans);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-light);
    padding:11px 14px;background:var(--cream);border:1px solid var(--cream-dark);border-radius:6px;transition:border-color .12s,background .12s;}
  .hdt-committees summary::-webkit-details-marker{display:none;}
  .hdt-committees summary:hover{border-color:var(--red);background:#fff;}
  .hdt-comm-n{background:var(--cream-dark);color:var(--ink-mid);border-radius:999px;padding:1px 8px;font-size:10px;letter-spacing:0;}
  .hdt-comm-cta{margin-left:auto;display:flex;align-items:center;gap:6px;color:var(--red);font-weight:800;letter-spacing:.04em;}
  .hdt-comm-txt::after{content:"Show all";}
  .hdt-committees[open] .hdt-comm-txt::after{content:"Hide";}
  .hdt-comm-arrow{font-size:13px;transition:transform .15s;}
  .hdt-committees[open] .hdt-comm-arrow{transform:rotate(180deg);}
  .hdt-committees[open] summary{border-color:var(--red);background:#fff;border-radius:6px 6px 0 0;}
  .hdt-committees .hdt-chips{margin-top:0;padding:12px 14px;border:1px solid var(--red);border-top:0;border-radius:0 0 6px 6px;}
  .hdt-share { display:flex; gap:10px; margin-top:22px;}
  .hdt-share button{flex:1;font-family:var(--sans);font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:12px;border:2px solid var(--ink);background:#fff;cursor:pointer;}
  .hdt-share button:hover{background:var(--ink);color:#fff;}

  /* ── Methodology ── */
  .hdt-method { background:var(--ink); color:rgba(255,255,255,.8);}
  .hdt-method .hdt-h2{color:#fff;} .hdt-method ul{font-family:var(--body-serif);font-size:14px;line-height:1.7;margin:0 0 0 18px;} .hdt-method a{color:#e88;}

  /* ── Filter bar (sticky, year x sector) ── */
  .hdt-filterbar { position:sticky; top:0; z-index:20; background:var(--cream); border-top:1px solid rgba(26,18,8,.08); border-bottom:1px solid rgba(26,18,8,.10); box-shadow:0 2px 10px rgba(26,18,8,.05); }
